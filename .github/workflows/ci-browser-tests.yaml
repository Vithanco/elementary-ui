name: Browser Tests

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "BrowserTests/**"
      - "BrowserRuntime/**"
      - "Package.swift"
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "BrowserTests/**"
      - "BrowserRuntime/**"
      - "Package.swift"
  workflow_dispatch:

env:
  SWIFT_VERSION: "6.3.3"
  WASM_SDK_URL: https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz
  WASM_SDK_CHECKSUM: cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: BrowserTests/pnpm-lock.yaml

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          skip-verify-signature: true

      - name: Install Swift WASM SDK
        run: swift sdk install ${{ env.WASM_SDK_URL }} --checksum ${{ env.WASM_SDK_CHECKSUM }}

      - name: Install wasm-opt
        uses: phi-ag/setup-binaryen@v1
        with:
          version: "123"

      - name: Install dependencies
        working-directory: BrowserTests
        run: pnpm preinstall && pnpm install

      # Keyed on the lockfile, which pins the Playwright version the browser builds
      # must match. System deps live outside the cache, so they are installed either way.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('BrowserTests/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: BrowserTests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: BrowserTests
        run: npx playwright install-deps chromium firefox webkit

      - name: Run browser tests
        working-directory: BrowserTests
        run: pnpm test
